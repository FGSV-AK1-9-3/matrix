<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SCENIC – Werteverlauf</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="custom.css" rel="stylesheet" />
  </head>

  <body>
    <script src="navbar.js"></script>

    <div class="container py-5">
      <h1 class="app-title mb-2">
        <i class="bi bi-graph-up me-2 text-primary"></i>Werteverlauf
      </h1>
      <p class="text-muted mb-4">
        Ihr aktueller Datensatz wird
        <strong style="color: var(--brand)">farbig hervorgehoben</strong>
        dargestellt. Die übrigen Linien zeigen vorhandene Vergleichsdaten.
      </p>

      <div class="card step-card">
        <canvas
          id="progressionChart"
          style="width: 100%; height: 500px"
        ></canvas>
      </div>

      <div class="d-flex gap-2 mt-4">
        <a href="index.html" class="btn btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>Zurück zum Formular
        </a>
      </div>
    </div>

    <footer class="mt-5 py-3 border-top text-center text-muted small">
      <div class="container">
        <span class="text-muted"
          >Forschungsgesellschaft für Straßen- und Verkehrswesen e. V.</span
        >
        &middot;
        <a
          href="https://www.fgsv.de/impressum"
          class="text-muted text-decoration-none"
          >Impressum</a
        >
        &middot;
        <a
          href="https://github.com/FGSV-AK1-9-3/matrix/issues/new"
          class="text-muted text-decoration-none me-3"
          >Feedback geben</a
        >
      </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <script>
      (() => {
        const STEPS = [
          { label: 'Basiswert', desc: 'log\u2082 der Personenzahl' },
          { label: 'VG-F', desc: 'Flächenverhältnis' },
          { label: 'VG-V', desc: 'Personenverkehrsstärke' },
          { label: 'VG-S', desc: 'Störungen auf Flucht- und Rettungswegen' },
          { label: 'VG-W', desc: 'Wegführung' },
          { label: 'VG-E', desc: 'Einlass / Auslass' },
          { label: 'G', desc: 'Grundform der Veranstaltungsfläche' },
          { label: 'B-E', desc: 'Entlastungsflächen' },
          { label: 'B-B', desc: 'Befestigter Grund' },
          { label: 'B-W', desc: 'Wetterlage' },
          { label: 'V-EK', desc: 'Einlasskontrolle' },
          { label: 'V-Z', desc: 'Zu- und Ablauf bei Ein-/Auslass' },
          { label: 'V-A', desc: 'Attraktionen / Bühnen' },
          {
            label: 'Endwert',
            desc: 'Ergebnis inkl. Wiederkehr und Besuchendenverhalten',
          },
        ];
        const STEP_LABELS = STEPS.map((s) => s.label);

        // Generate random test data and reload chart
        window.loadTestData = function () {
          const p = Math.floor(Math.random() * 9900) + 100;
          const base = Math.log2(p);
          const factors = [0.9, 1.0, 1.1, 1.2, 1.3];
          const pick = () =>
            factors[Math.floor(Math.random() * factors.length)];
          const v = [parseFloat(base.toFixed(2))];
          let cum = base;
          for (let i = 0; i < 12; i++) {
            cum *= pick();
            v.push(parseFloat(cum.toFixed(2)));
          }
          const additive = [0, 1, 5, 10][Math.floor(Math.random() * 4)];
          v.push(parseFloat((cum + additive * pick()).toFixed(2)));
          localStorage.setItem('scenic_current', JSON.stringify({ p, v }));
          location.reload();
        };

        // Read current dataset from localStorage
        const currentRaw = localStorage.getItem('scenic_current');
        const currentData = currentRaw ? JSON.parse(currentRaw) : null;
        // TODO: Remove the button "Testdaten laden" once it is deployed. This button is only for testing purposes
        if (!currentData) {
          document.getElementById('progressionChart').parentElement.innerHTML =
            '<p class="text-muted text-center py-5">' +
            '<i class="bi bi-exclamation-circle me-2"></i>' +
            'Keine aktuellen Daten vorhanden. Bitte füllen Sie zuerst das ' +
            '<a href="index.html">Formular</a> aus und klicken Sie auf „Absenden".' +
            '<br><button class="btn btn-sm btn-outline-primary mt-3" onclick="loadTestData()">' +
            '<i class="bi bi-lightning me-1"></i>Testdaten laden</button></p>';
          return;
        }

        // Fetch historical data and render chart
        fetch('resources/werteverlauf.json')
          .then((res) => res.json())
          .then((historicalData) => {
            renderChart(historicalData, currentData);
          })
          .catch((err) => {
            console.error('Failed to load historical data:', err);
            // Render with current data only
            renderChart([], currentData);
          });

        function renderChart(historicalData, current) {
          const datasets = [];

          // Historical datasets: thin, semi-transparent lines
          historicalData.forEach((entry, i) => {
            datasets.push({
              label: `${entry.p.toLocaleString('de-DE')} Pers.`,
              data: entry.v,
              borderColor: 'rgba(150, 170, 200, 0.25)',
              backgroundColor: 'rgba(150, 170, 200, 0.05)',
              borderWidth: 1.5,
              pointRadius: 0,
              pointHoverRadius: 4,
              tension: 0.3,
              order: 2,
            });
          });

          // Current dataset: thick, highlighted line
          datasets.push({
            label: `Aktuell: ${current.p.toLocaleString('de-DE')} Pers.`,
            data: current.v,
            borderColor: 'rgba(13, 110, 253, 1)',
            backgroundColor: 'rgba(13, 110, 253, 0.1)',
            borderWidth: 3.5,
            pointRadius: 5,
            pointBackgroundColor: 'rgba(13, 110, 253, 1)',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointHoverRadius: 7,
            tension: 0.3,
            order: 1,
          });

          const ctx = document
            .getElementById('progressionChart')
            .getContext('2d');

          const chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
              labels: STEP_LABELS,
              datasets: datasets,
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: 'index',
                intersect: false,
              },
              plugins: {
                legend: {
                  display: true,
                  labels: {
                    // Only show legend entry for the current dataset
                    filter: (item) => item.datasetIndex === datasets.length - 1,
                    font: { weight: 'bold', size: 13 },
                  },
                },
                tooltip: {
                  displayColors: false,
                  callbacks: {
                    title: (items) => {
                      const idx = items[0]?.dataIndex;
                      return STEPS[idx]?.desc || items[0]?.label || '';
                    },
                    label: () => null,
                    afterBody: (items) => {
                      const stepIdx = items[0]?.dataIndex;
                      if (stepIdx == null || stepIdx === 0) return [];

                      // Collect all values at this step
                      const allValues = historicalData
                        .map((e) => e.v[stepIdx])
                        .filter((v) => v != null);
                      const currentVal = current.v[stepIdx];
                      allValues.push(currentVal);
                      allValues.sort((a, b) => a - b);

                      const rank = allValues.indexOf(currentVal) + 1;
                      const total = allValues.length;
                      const min = Math.min(...allValues);
                      const max = Math.max(...allValues);
                      const median = allValues[Math.floor(total / 2)];

                      return [
                        `Wert: ${currentVal.toFixed(2)}`,
                        '',
                        `Rang: ${rank} von ${total}`,
                        `Min: ${min.toFixed(2)}  |  Median: ${median.toFixed(2)}  |  Max: ${max.toFixed(2)}`,
                      ];
                    },
                  },
                  // Only show one tooltip (for the current dataset)
                  filter: (item) => item.datasetIndex === datasets.length - 1,
                },
              },
              scales: {
                x: {
                  title: {
                    display: true,
                    text: 'Berechnungsschritt',
                    font: { weight: 'bold' },
                  },
                  grid: {
                    color: 'rgba(0, 0, 0, 0.04)',
                  },
                },
                y: {
                  title: {
                    display: true,
                    text: 'Kumulativer Wert',
                    font: { weight: 'bold' },
                  },
                  beginAtZero: true,
                  grid: {
                    color: 'rgba(0, 0, 0, 0.06)',
                  },
                },
              },
            },
          });
        }
      })();
    </script>
  </body>
</html>
